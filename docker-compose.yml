services:
  url-shortener:
    build:
      context: .
      dockerfile: url-shortener-web/Dockerfile
    image: uguztech/url-shortener-web:latest
    container_name: url-shortener-web
    ports:
      - "127.0.0.1:7070:7070"
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:7070}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
    restart: unless-stopped

  qr-generator:
    build:
      context: .
      dockerfile: qr-generator-web/Dockerfile
    image: uguztech/qr-generator-web:latest
    container_name: qr-generator-web
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
    restart: unless-stopped